services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: health_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health_agent_dev}
      POSTGRES_DB: health_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - health_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_agent -d health_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  health_agent_pgdata:
