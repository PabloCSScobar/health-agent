x-app: &app
  image: health-agent:local
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+psycopg://health_agent:${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}@db:5432/health_agent
  volumes:
    - health_agent_backups:/app/backups
  init: true

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: health_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: health_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - health_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_agent -d health_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
    command: ["uvicorn", "health_agent.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    <<: *app
    command: ["python", "-m", "health_agent.channels.telegram"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  health_agent_pgdata:
  health_agent_backups:
